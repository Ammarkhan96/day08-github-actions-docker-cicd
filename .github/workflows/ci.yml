name: Day08 GitHub Actions CICD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Automated Tests
        run: |
          python -m pytest -v
      
      - name: Build Docker Image
        run: |
          docker build -t day08-ci-cd-demo:${{ github.sha }}

      - name: Run Docker Container
        run: |
          docker run -d \
            --name day08-ci-app \
            -p 8080:8000 \
            day08-ci-cd-demo:${{ github.sha }}

      - name: Test Health Endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/health; then
              echo "Health check successful"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs day08-ci-app
          exit 1

      - name: Test Home Endpoint
        run: |
          curl --fail --silent --show-error http://localhost:8080/

      - name: Display Container Logs
        if: always()
        run: |
          docker logs day08-ci-app || true

      - name: Cleanup Container
        if: always()
        run: |
          docker rm -f day08-ci-app || true
